<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    make.fun sticker: the mascot badge in the brand's flat style. A magenta disc inside a heavy black
    ring, the white ghost with sparkle eyes, its floating hand and the star coin, with the name on a
    black tab hung under it. One white die-cut margin runs round the whole shape.
    The ghost is drawn in the logo's coordinates (disc centre 450,400, radius 350) and placed by a
    single transform, so its proportions stay the logo's.
  -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <!-- A four-point sparkle of radius 1 with pinched sides. -->
    <path id="sparkle" d="M0 -1 Q0.12 -0.12 1 0 Q0.12 0.12 0 1 Q-0.12 0.12 -1 0 Q-0.12 -0.12 0 -1 Z"/>
  </defs>

  <rect width="1024" height="1024" fill="#1B1D24"/>

  <!-- Die-cut: one white shape round the disc and the name tab. -->
  <g filter="url(#shadow)" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="56" stroke-linejoin="round">
    <circle cx="512" cy="452" r="352"/>
    <rect x="262" y="772" width="500" height="128" rx="64"/>
  </g>

  <g transform="translate(512 452) scale(0.943) translate(-450 -400)" stroke="#111114" stroke-linejoin="round" stroke-linecap="round">
    <!-- Disc and ring. -->
    <circle cx="450" cy="400" r="350" fill="#C8228F" stroke-width="44"/>

    <!-- The ghost: a dome, a straight right side, a chunky arm on the left, two feet. -->
    <path fill="#FFFFFF" stroke-width="30" d="
      M430 612
      C470 616 545 618 572 604
      C598 590 604 565 602 535
      C600 470 596 400 594 330
      C591 222 522 152 430 152
      C338 152 266 220 263 320
      L262 392
      C224 398 195 440 197 490
      C199 546 230 572 268 573
      C269 602 287 615 330 615
      C370 617 405 615 430 612 Z"/>
    <!-- The arm's crease and the notch between the feet. -->
    <path fill="none" stroke-width="13" d="M273 486 L273 532 M430 612 L430 580"/>

    <!-- Sparkle eyes. -->
    <use href="#sparkle" transform="translate(404 322) scale(34)" fill="#111114" stroke="none"/>
    <use href="#sparkle" transform="translate(516 306) scale(34)" fill="#111114" stroke="none"/>

    <!-- The star coin and the floating hand that holds it. -->
    <circle cx="656" cy="336" r="60" fill="#C8228F" stroke-width="30"/>
    <path fill="#FFFFFF" stroke="none" transform="translate(658 338) rotate(-12) scale(37)"
          d="M0 -1 L0.235 -0.324 L0.951 -0.309 L0.38 0.124 L0.588 0.809 L0 0.4 L-0.588 0.809 L-0.38 0.124 L-0.951 -0.309 L-0.235 -0.324 Z"/>
    <circle cx="626" cy="460" r="44" fill="#FFFFFF" stroke-width="30"/>
  </g>

  <!-- The name, on a black tab under the disc. -->
  <rect x="262" y="772" width="500" height="128" rx="64" fill="#111114"/>
  <text x="512" y="864" text-anchor="middle" font-family="Inter Display" font-weight="900" font-size="88"
        letter-spacing="-2" fill="#FFFFFF">make<tspan fill="#E04AAE">.</tspan>fun</text>
</svg>
